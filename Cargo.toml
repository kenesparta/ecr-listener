[package]
name = "ecr-listener"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Long-polls an SQS queue for ECR push events and starts the matching systemd deploy unit"
repository = "https://github.com/kenesparta/ecr-listener"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-sqs = { version = "1.119.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
clap = { version = "4.6.7", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "usage",
] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "process", "rt", "signal", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "std",
] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["sync", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
mod_module_files = "warn"
wildcard_imports = "warn"
enum_glob_use = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
